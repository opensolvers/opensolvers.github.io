- id: x60-gemv-hpl-rv2
  title: "NaN Linpack on RISC-V: Fixing OpenBLAS gemv_n on Orange Pi RV2 (EESSI)"
  description: >
    Stock EESSI OpenBLAS on an Orange Pi RV2 reports ~8.5 GFLOP/s on HPL — then
