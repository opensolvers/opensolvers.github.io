- id: qe-blas-real-dft
  title: "Quantum ESPRESSO on RISC-V: Stock BLAS MPI_ABORTs a Real DFT on BPI-F3"
  description: >
    Stock EESSI OpenBLAS aborts Quantum ESPRESSO in inverse_s (MPI_ABORT) —
    the same gemv_n bug that NaN’d HPL. Patched RVV: −14.57861334 Ry, then a
    64-atom SCF 144.8 → 110.3 s (1.31×). calbec ~2×; fftw ~1.01×. Measured on
    Banana Pi F3.
