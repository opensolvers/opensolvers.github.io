- id: fftw-micro-vs-apps
  title: "When RVV FFT Wins 1.6× — and Gives 0% in Quantum ESPRESSO"
  description: >
    RVV FFTW is real on SpaceMiT X60 (1.60× at N=256 under MEASURE), but the
